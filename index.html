<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="light">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Page transition with WebGPU</title>
    <meta name="description"
          content="Portfolio of Dmitriy Shalberkin. Project gallery with WebGPU-powered page transitions."/>
    <link rel="stylesheet" type="text/css" href="src/global.css"/>
    <script>
        document.documentElement.className = 'js';
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') {
                document.documentElement.setAttribute('data-theme', t);
            }
        } catch (e) {
        }
    </script>
</head>

<body>
<div id="root"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
